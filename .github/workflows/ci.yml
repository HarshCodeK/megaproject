name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # No API key on purpose: the offline fallback and the sandbox tests must
      # pass with the provider unreachable. That is the path this project claims
      # degrades gracefully, so it has to be tested.
      - run: python -m pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with: {context: ., push: false, load: true, tags: megaproject:test}
      - name: Start it and check /health
        run: |
          docker run -d --name mp -p 8000:8000 megaproject:test
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 6
          done
          docker logs mp; exit 1
