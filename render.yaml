services:
  - type: web
    name: megaproject
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn megaproject.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: WORKSPACE_ROOT
        value: /opt/render/project/src/workspace
